  description: >-
    A bounded, public verification slice for five heterogeneous records under
    prefix 21.T11966. The package preserves their observed FDO registry
    classifications and lifecycle distinctions, records provenance and
    relationships, includes exact historical experimental v0.1 specification
    and schema snapshots, and supplies synthetic fixtures plus a deterministic
    offline Python runner for limited structural and three-digest integrity
    checks. It is a historical experimental candidate, not an official FDO
    standard, certification, production-ready implementation, adoption claim,
    or community-governed specification.
